# VA mints 設定ファイル
#
# 数値パラメータは docs/03_requirements.md 第5章「パラメータ管理」の方針に従い、
# ハードコードせずここで一元管理する。各項目のコメントに一次資料の版数を明記する。
#
# 参照した一次資料現物（docs/primary-sources/ 取得時点の版）：
#   - 操作マニュアル〜当事者ユーザ編〜 2.3版（令和8年7月15日改訂）
#   - mints Q&A（令和8年4月時点回答一覧）
#   - 民事訴訟フェーズ3に向けた準備の手引（令和8年6月19日版）
# これらの版は取得時点のものであり、mints側の更新に追従しない。
# 疑義が生じた場合は一次資料現物→mints画面内の最新情報の順に確認すること。
#
# 【セクションの並び順】書き出し実行時にユーザーへの確認・チェックボックスが
# 表示される順序（upload→evidence_number→filename→evidence_stamp）に、
# 対話的なプロンプトを持たず自動検出・レポート表示のみを行う項目
# （pdf・pii_detection）、非対話的なlogging、の順に並べている。

upload:
  # 1回のアップロード合計上限（MB）。
  # 根拠：mints Q&A 9頁「一度にアップロードできる容量は最大200MB」（一次・確定）。
  # 単体ファイルの独自上限は一次資料に明示なし（推論にとどまる。docs/02_constraints-report.md 第8章確定事項5参照）。
  max_total_mb: 200

  # 200MB分割時の安全マージン（累積サイズがこの比率に達したら次バッチへ）。
  # 根拠：一次資料に定めはなく、実装上の安全側パラメータ（docs/03_requirements.md 4.5節）。
  safety_margin_ratio: 0.9

evidence_number:
  # 証拠番号パターン（甲/乙/丙 + 半角3桁数字、被告複数時の乙A等〔半角英字〕、枝番のハイフン/アンダースコア両対応）。
  # 根拠：準備の手引29頁「ファイル名：...（英数字は半角）例）「甲001 売買契約書原本」、「乙A001 領収書」」
  # （原文で明確に半角と指定。全角の「乙Ａ001」は誤り。docs/02_constraints-report.md第5章1節の
  # 記載は転記時に全角化していたため、一次資料の原文表記に合わせて訂正）。
  symbols: ['甲', '乙', '丙']
  digits: 3

filename:
  # 拡張子込みの上限文字数（全角・半角とも1文字と計算）。
  # 根拠：操作マニュアル2.3版6頁（一次・確定）、別紙2エラー#53。
  max_length: 100

  # 実務推奨の警告閾値（二次情報だが安全側の二段構えとして採用）。
  # 根拠：docs/02_constraints-report.md 第3章2節（初版からの訂正の記述を参照）。
  warning_length: 50

  # ファイル名に使用不可とするWindowsファイルシステム予約文字。
  # mints側の禁止文字の正確な一覧は一次資料に明記がないため、
  # 出力ファイルがWindows上でも安全に扱えることを目的として設定。
  forbidden_chars: ['\\', '/', ':', '*', '?', '"', '<', '>', '|']

  # JIS X 0213:2004 外字判定に使用するコーデック（Python標準ライブラリ）。
  # 根拠：操作マニュアル2.3版6頁「使用できる文字はJIS X 0213が基本」（一次）。
  jis_x0213_codec: shift_jis_2004

evidence_stamp:
  # 証拠番号右上スタンプ（4.7）のレイアウトパラメータ。
  # 根拠：準備の手引29頁は「証拠データの右上にも記載」とのみ指定し、文字サイズ・
  # 余白の数値定めは一次資料になし（実装上の値。第7章「公式規定のない事項の扱い」参照）。
  font_size_pt: 10
  margin_top_mm: 8
  margin_right_mm: 8

  # スタンプの見た目。black／red／red_boxed のいずれか。既定はred（赤字・囲みなし）。
  # 根拠：一次資料（準備の手引・操作マニュアル・FAQ）を精査したが、証拠番号の
  # 色・枠についての規定はどこにも見当たらなかった（mints導入前の紙媒体実務では
  # 赤枠・赤字が慣行だったが、公式資料は単に沈黙している）。第7章「公式規定の
  # ない事項の扱い」の方針により、無条件の自動選択ではなくオプトインの選択肢
  # として提供する。実行中の切替は不要との指示のため、設定ファイルでのみ指定する。
  style: red

  # style: red_boxed の場合のみ使用する枠線パラメータ。一次資料に数値定めなし
  # （実装上の値）。
  box_line_width_pt: 1.0
  box_padding_mm: 1.5

pdf:
  # 用紙寸法（mm）。根拠：Q&A 7頁、操作マニュアル2.3版66頁（一次・確定）。
  a4_mm: [210, 297]
  a3_mm: [297, 420]

  # 用紙寸法判定の許容誤差（mm）。一次資料に数値定めはなく、
  # スキャン・PDF生成時の実測誤差を吸収するための実装上の値。
  size_tolerance_mm: 3

pii_detection:
  # 個人情報パターンの検出（要件定義書4.9）。PDFのテキストレイヤー及び
  # ファイル名から、正規表現により個人情報らしいパターンを検出して警告する。
  # 検出のみを行い、削除・墨消しの実行はしない。誤検出（事件番号・書証中の
  # 日付等を誤って拾う場合）があり得るため、断定を避けた警告文言と組み合わせて
  # 使う（呼び出し側〔ui/formatting.py〕で対応）。一次資料にパターンの定めは
  # なく、いずれも実装上の値。ここに追加・削除・調整すれば検出対象を変更できる。
  # 「クレジットカード番号」カテゴリのみ、検出後にLuhnチェックを併用する
  # （detectors/pii_detector.py参照）。
  # 境界判定に\bは使わない：Pythonの\wは漢字・かなを含むため、「電話03-1234-…」の
  # ように数字がラベル漢字へ直接続く日本語文中の表記（日本語PDFでは主流）を
  # \bが弾いてしまい、系統的な見逃しになる。数字の連続だけを境界とする
  # (?<![0-9-])・(?![0-9-]) を用いる（ハイフンも境界から除外するのは、
  # 「発行番号 00394577-20260303-00000024」のようなハイフン連結の書類番号の
  # 一部分を誤って拾わないため。戸籍謄本の発行番号での誤検出事例に対応）。
  # 全角数字（０９０−…等）は検出側（detectors/pii_detector.py）がNFKC正規化
  # してからマッチするため対応済み。
  # 銀行口座番号は、桁数（7〜8桁）だけでは書類の整理番号・受付番号等と
  # 区別できず誤検出だらけになるため、直前15文字以内に「口座」「普通」
  # 「当座」のいずれかがある場合に限って検出する。
  # 電話番号はハイフン区切りが基本パターン。ハイフンなしの連続数字は誤検出が
  # 多いため、桁構成が固定的な携帯電話（070/080/090始まりの11桁）のみ
  # 別カテゴリで検出する（固定電話のハイフンなしは対象外＝既知の限界）。
  patterns:
    マイナンバー: '(?<![0-9-])\d{12}(?![0-9-])'
    電話番号: '(?<![0-9])0\d{1,4}-\d{1,4}-\d{4}(?![0-9])'
    携帯電話番号（ハイフンなし）: '(?<![0-9-])0[789]0\d{8}(?![0-9-])'
    メールアドレス: '[\w.+-]+@[\w-]+\.[\w.-]+'
    郵便番号・住所: '(?<![0-9-])\d{3}-\d{4}(?![0-9-])'
    銀行口座番号: '(?:口座|普通|当座)\D{0,15}\d{7,8}(?![0-9-])'
    クレジットカード番号: '(?<![0-9-])\d(?:[ -]?\d){12,18}(?![0-9-])'

logging:
  # デバッグ用詳細ログの出力先（4.8のユーザー向けレポートとは別。docs/03_requirements.md 第5章「ログ」参照）。
  log_dir: logs
  level: INFO
